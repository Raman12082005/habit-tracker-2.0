services:
  postgres:
    image: postgres:17-alpine
    container_name: habittracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: habit_tracker
      POSTGRES_USER: habit_admin
      POSTGRES_PASSWORD: habit_dev_password
    ports:
      - "5433:5432"
    volumes:
      - habittracker_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: habittracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - habittracker_redisdata:/data

volumes:
  habittracker_pgdata:
  habittracker_redisdata:
